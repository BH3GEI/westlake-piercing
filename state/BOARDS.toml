# ---- 已知硬件病 + 恢复决策(2026-07-09 定) ----
# dalvikvm crash → USB daemon 崩 → USB gadget 未枚举 → hdc 掉线,需物理断电重插。
# 电源不做遥控自动化(用户裁决)。掉线 → board-recover.sh bark 用户手动重插,脚本守着等回来+重挂。
# Mac 睡眠已核实无碍:pmset sleep=0(2026-07-09 实测)。

[power]
automation = "none"  # 用户裁决:不接遥控电源;需要断电操作时 bark 喊人
recover    = "oracle/board-recover.sh <serial> [wait-min]"
mac_sleep  = "off"   # pmset sleep=0,2026-07-09 核实
