# Human-readable repo skill lock.
# This records the reproducibility contract, not every generated byte in the repo.

[source]
upstream = "A2OH/westlake-piercing"
fork = "BH3GEI/westlake-piercing"
base_commit = "b9ede74ac6a19e9e05e09800a4c8757b60ea48d5"
default_branch = "main"
locked_at = "2026-06-30"

[project]
name = "Westlake"
claim = "Run stock Android APKs on OpenHarmony DAYU200/RK3568 through appspawn-x."
reproducibility = "source-available, artifact-required"

[hardware]
board = "DAYU200 / RK3568"
userspace = "32-bit arm"
transport = "hdc"
full_replay_requires_board = true

[host.reference]
os = "WSL2 Ubuntu or Linux"
ohos_tree = "$HOME/openharmony"
android_sdk = "$HOME/android-sdk"
jdk = "17"
dex2oat64 = "$HOME/tools/dex2oat64"
restool = "$HOME/openharmony/out/sdk/ohos-sdk/linux/toolchains/restool"

[apps.catalog]
package = "io.material.catalog"
upstream = "material-components/material-components-android"
version = "1.9.0"
target_sdk = 33
status = "launches from icon; 32 categories navigable; 0 functional failures in documented sweep"

[apps.noice]
package = "com.github.ashutoshgngwr.noice"
upstream = "trynoice/android-app"
version = "2.5.1"
version_code = 66
target_sdk = 33
status = "renders; D-pad and touch interactive; 9/10 pages crash-free"

[artifacts.policy]
large_binaries_committed = false
inventory = "ARTIFACT-INVENTORY.txt"
baseline_env = "WESTLAKE_BASELINE_DIR"
default_baseline_dir = "$HOME/westlake-complete"

